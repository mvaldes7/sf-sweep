<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SF Sweep" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>SF Sweep - street cleaning by side of street</title>
</head>
<body>
  <div id="map" aria-label="Map of street cleaning status"></div>

  <header class="top">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      <input id="q" type="search" role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="false" placeholder="Search address, street or block" autocomplete="off" aria-label="Search address, street or block" />
      <button id="locate" class="icon-btn" aria-label="Locate me">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
    </div>
    <div id="search-status" class="search-status" role="status" aria-live="polite"></div>
    <ul id="results" class="results" role="listbox" hidden></ul>
    <div class="seg" role="tablist">
      <button id="mode-live" role="tab" aria-selected="true">Live now + 6h</button>
      <button id="mode-plan" role="tab" aria-selected="false">Plan by day</button>
    </div>
    <div id="chips" class="chips" hidden></div>
    <div class="legend-row">
    <div id="legend" class="legend" aria-label="Legend: live status">
      <span class="lg clear"><i class="sw"></i>Clear</span>
      <span class="lg soon"><i class="sw"></i>Within 1 hr</span>
      <span class="lg now"><i class="sw"></i>Sweeping now</span>
    </div>
    <button id="safe-btn" class="pill safe-btn" aria-pressed="false">Safe spot nearby</button>
    </div>
  </header>

  <section id="timelapse" class="timelapse panel">
    <div class="tl-row">
      <button id="play" class="pill" aria-label="Play timelapse">Play</button>
      <input id="scrub" type="range" min="0" max="72" value="0" step="1" aria-label="Time offset" />
      <button id="speed" class="pill" aria-label="Playback speed">1x</button>
    </div>
    <div id="tl-label" class="tl-label"></div>
  </section>

  <section id="plan" class="panel plan" hidden></section>
  <section id="car" class="panel car" hidden></section>
  <section id="safe" class="panel safe-panel" aria-live="polite" hidden></section>
  <section id="detail" class="panel sheet" hidden></section>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <footer class="attrib" id="attrib">
    Map: <a href="https://protomaps.com" target="_blank" rel="noopener">Protomaps</a> &copy; <a href="https://openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, <a href="https://maplibre.org" target="_blank" rel="noopener">MapLibre</a>.
    Data: <a href="https://data.sf.gov/d/yhqp-riqs" target="_blank" rel="noopener">DataSF street sweeping</a>, <a href="https://data.sf.gov/d/3mea-di5p" target="_blank" rel="noopener">EAS addresses (PDDL)</a>.
    Holidays: <a href="https://www.sfmta.com/getting-around/drive-park/holiday-enforcement-schedule" target="_blank" rel="noopener">SFMTA</a>.
    Posted signs are authoritative.
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
