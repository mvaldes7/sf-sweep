name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          ALLOW_MISSING_DATA: "1"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Read-only public assets; no Cloudflare credentials or deployment writes.
      - name: Download current public sweeping data
        run: |
          for file in sweep-index.json sweep-sides.geojson sweep-times.json; do
            curl --fail --retry 2 "https://sf-sweep.pages.dev/data/$file" -o "public/data/$file"
          done
      - run: pnpm test:e2e
        env:
          VITE_BASEMAP_PMTILES_URL: https://sf-sweep.pages.dev/data/basemap/{z}/{x}/{y}.mvt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-search-chromium-screenshots
          path: |
            address-shots/
            test-results/
