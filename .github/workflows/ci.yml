name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          ALLOW_MISSING_DATA: "1"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Committed fixtures for the e2e addresses (534 30th Ave, 1000 Valencia St).
      # No live-site download, no R2, and no pinned deployment URL.
      - name: Install fixture sweeping data
        run: |
          mkdir -p public/data
          cp tests/fixtures/data/sweep-index.json tests/fixtures/data/sweep-sides.geojson tests/fixtures/data/sweep-times.json public/data/
      - run: pnpm test:e2e
        env:
          VITE_BASEMAP_PMTILES_URL: off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-search-chromium-screenshots
          path: |
            address-shots/
            test-results/
