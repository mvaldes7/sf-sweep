# sf-sweep-reports: photo reports + review queue (Cloudflare Workers free tier).
# Do not deploy this real Worker (main = src/index.ts) without Mike's explicit OK.
# The live placeholder is uploaded with wrangler.stub.toml and returns 503 for every request.
name = "sf-sweep-reports"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://sf-sweep.pages.dev,https://*.sf-sweep.pages.dev"
# Public Turnstile site key (not the secret). Filled after the Turnstile site is created.
TURNSTILE_SITE_KEY = ""

# TODO: replace database_id after `wrangler d1 create sf-sweep-reports`.
[[d1_databases]]
binding = "DB"
database_name = "sf-sweep-reports"
database_id = "TODO-replace-after-d1-create"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "sf-sweep-sign-photos"

# Account-unique integer for this Worker (sf-sweep-alerts uses 1801). Free-plan rate limiting binding.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1802"
simple = { limit = 5, period = 60 }

# Local development only: `npx wrangler dev --env dev` from this directory.
[env.dev]
[env.dev.vars]
ALLOWED_ORIGIN = "https://sf-sweep.pages.dev,https://*.sf-sweep.pages.dev,http://localhost:5173"
TURNSTILE_SITE_KEY = ""

[[env.dev.d1_databases]]
binding = "DB"
database_name = "sf-sweep-reports"
database_id = "TODO-replace-after-d1-create"

[[env.dev.r2_buckets]]
binding = "PHOTOS"
bucket_name = "sf-sweep-sign-photos"
