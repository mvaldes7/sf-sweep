# Placeholder deploy only. Returns 503 for every request until Mike OKs the real Worker.
# Usage: npx wrangler deploy -c wrangler.stub.toml
# Do not point this file at src/index.ts.
name = "sf-sweep-reports"
main = "src/stub.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://sf-sweep.pages.dev,https://*.sf-sweep.pages.dev"
# Optional public Turnstile site key (not the secret). Off in v1; leave empty to skip verification.
TURNSTILE_SITE_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "sf-sweep-reports"
database_id = "970b90d1-0ad2-4424-9807-517bca2a85a0"

[[kv_namespaces]]
binding = "PHOTOS"
id = "2e73ed962475440fb4a7edc35981cf78"

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1802"
simple = { limit = 5, period = 60 }
